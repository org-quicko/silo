name: release-snapshot

on:
  push:
    tags: ["v*-alpha*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without the leading v. No image is pushed to GHCR."
        required: true
        type: string

permissions:
  contents: read

env:
  BUN_VERSION: "1.4.2"

concurrency:
  group: release-snapshot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      - id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi

          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::'$version' is not a semantic version" && exit 1 ;;
          esac

          case "$version" in
            *-*) prerelease=true ;;
            *) prerelease=false ;;
          esac

          declared=$(jq -r .version package.json)
          if [ "$declared" != "$version" ]; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "::warning::building $version from a tree that declares $declared — fine for a rehearsal, not for a tag"
            else
              echo "::error::tag v$version does not match package.json ($declared). Run: bun run set-version $version"
              exit 1
            fi
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "silo $version (prerelease=$prerelease, declared=$declared)"

  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: silo
          POSTGRES_PASSWORD: silo
          POSTGRES_DB: silo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U silo -d silo_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      SILO_TEST_PG_URL: postgres://silo:silo@localhost:5432/silo_test
      SILO_TEST_PG_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Find initdb for the TLS tests
        run: |
          bin=$(ls -d /usr/lib/postgresql/*/bin 2>/dev/null | sort -V | tail -n 1)
          test -n "$bin" || { echo "::error::no Postgres binaries on the runner"; exit 1; }
          echo "SILO_TEST_PG_BIN=$bin" >> "$GITHUB_ENV"
      - name: Type-check
        run: bunx tsc -b
      - name: Build silo-client
        run: bun run --cwd packages/silo-client build
      - name: Test
        run: bun test

  ghcr:
    needs: [version, verify]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # An alpha is still an artifact somebody pulled rather than built, so
          # it says which alpha it is instead of appending `-dev` (D90).
          build-args: |
            SILO_VERSION=${{ needs.version.outputs.version }}
          # `:alpha`, not `:latest`. Since release.yml publishes the same
          # repository (D90), `latest` names a release, and an alpha pushed
          # after one would otherwise hand every `docker pull` a pre-release
          # amd64 image.
          tags: |
            ghcr.io/org-quicko/silo:${{ needs.version.outputs.version }}
            ghcr.io/org-quicko/silo:alpha
